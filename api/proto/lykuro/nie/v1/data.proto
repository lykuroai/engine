syntax = "proto3";

package lykuro.nie.v1;

import "lykuro/nie/v1/common.proto";

// Data API (spec §9.2): used only by the authenticated Lykuro Local LLM
// Platform / Gateway over mTLS. Never bound to a public interface.
service DataService {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  rpc GenerateStream(GenerateRequest) returns (stream StreamEvent);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc CountTokens(CountTokensRequest) returns (CountTokensResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message GenerationParams {
  uint32 max_output_tokens = 1;   // required, 1..certified limit
  float temperature = 2;          // >= 0; 0 selects greedy
  float top_p = 3;                // (0, 1]; 0 means "unset" -> 1.0
  uint32 top_k = 4;               // 0 means disabled
  int64 seed = 5;
  repeated string stop = 6;       // bounded count and byte length
}

message SchedulingParams {
  uint32 priority = 1;            // 0..100, clamped to platform ceiling
  int64 deadline_unix_ms = 2;     // 0 means no explicit deadline
}

message CacheParams {
  string reuse_handle = 1;        // empty = no reuse (MVP default OFF)
  bool allow_prefix_cache = 2;
}

message GenerateInput {
  // Exactly one of messages / prompt (spec §9.5).
  repeated Message messages = 1;
  string prompt = 2;
}

message GenerateRequest {
  string request_id = 1;          // required
  string trace_id = 2;
  string tenant_scope = 3;        // opaque hash; resource scoping only, not auth
  string project_scope = 4;
  string model_instance_id = 5;   // required
  GenerateInput input = 6;
  GenerationParams generation = 7;
  SchedulingParams scheduling = 8;
  CacheParams cache = 9;
}

message GenerateResponse {
  string request_id = 1;
  string model_instance_id = 2;
  string output_text = 3;
  FinishReason finish_reason = 4;
  Usage usage = 5;
  Timing timing = 6;
  string cache_reuse_handle = 7;  // empty when caching disabled
}

// Streaming events (spec §9.7). Sequence numbers are monotonic per request.
message StreamEvent {
  string request_id = 1;
  uint64 sequence = 2;
  int64 timestamp_unix_ms = 3;
  oneof event {
    Started started = 4;
    OutputTextDelta output_text_delta = 5;
    UsageEvent usage = 6;
    Completed completed = 7;
    EngineError error = 8;
  }

  message Started {
    string model_instance_id = 1;
  }
  message OutputTextDelta {
    string text = 1;  // always valid UTF-8; partial code points are buffered
  }
  message UsageEvent {
    Usage usage = 1;
  }
  message Completed {
    FinishReason finish_reason = 1;
    Usage usage = 2;
    Timing timing = 3;
  }
}

message CancelRequest {
  string request_id = 1;
}

message CancelResponse {
  // Cancel is idempotent: cancelling an unknown/finished request succeeds
  // with found=false.
  bool found = 1;
}

message CountTokensRequest {
  string model_instance_id = 1;
  GenerateInput input = 2;
}

message CountTokensResponse {
  uint32 input_tokens = 1;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  string engine_version = 1;
  string engine_abi = 2;
  string model_instance_id = 3;      // empty when no model loaded
  string model_family = 4;
  string architecture = 5;
  uint32 max_context_tokens = 6;
  uint32 max_output_tokens = 7;
  bool streaming = 8;
  bool logprobs = 9;                 // MVP: false
  bool prefix_cache = 10;            // MVP: false
  bool multi_gpu = 11;               // MVP: false (spec §17.5)
  repeated string supported_precisions = 12;
}
