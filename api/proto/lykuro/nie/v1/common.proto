syntax = "proto3";

package lykuro.nie.v1;

// Shared message types for the Native Inference Engine internal APIs.
// Versioning: package-level v1. Breaking changes require a new package version
// (lykuro.nie.v2) and N/N-1 compatibility with the Local LLM Platform.

// Stable engine error codes (spec §21.2). Transported inside EngineError,
// never as bare gRPC status strings, so that clients can rely on them.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_AUTHENTICATION_FAILED = 2;
  ERROR_CODE_MODEL_NOT_LOADED = 3;
  ERROR_CODE_UNSUPPORTED_MODEL = 4;
  ERROR_CODE_ARTIFACT_VERIFICATION_FAILED = 5;
  ERROR_CODE_CONTEXT_LENGTH_EXCEEDED = 6;
  ERROR_CODE_RESOURCE_EXHAUSTED = 7;
  ERROR_CODE_CAPACITY_EXHAUSTED = 8;
  ERROR_CODE_DEADLINE_REJECTED = 9;
  ERROR_CODE_DEADLINE_EXCEEDED = 10;
  ERROR_CODE_REQUEST_CANCELLED = 11;
  ERROR_CODE_ENGINE_DRAINING = 12;
  ERROR_CODE_GPU_OOM = 13;
  ERROR_CODE_GPU_UNHEALTHY = 14;
  ERROR_CODE_INFERENCE_FAILED = 15;
  ERROR_CODE_STREAM_CONSUMER_SLOW = 16;
  ERROR_CODE_INTERNAL_ERROR = 17;
  // Metal backend codes (LYK-NIE-ADD-METAL-001 §21).
  ERROR_CODE_METAL_BACKEND_UNAVAILABLE = 18;
  ERROR_CODE_METAL_DEVICE_UNSUPPORTED = 19;
  ERROR_CODE_METAL_LIBRARY_INVALID = 20;
  ERROR_CODE_METAL_PIPELINE_CREATION_FAILED = 21;
  ERROR_CODE_METAL_COMMAND_FAILED = 22;
  ERROR_CODE_METAL_MEMORY_PRESSURE = 23;
  ERROR_CODE_METAL_OUT_OF_MEMORY = 24;
  ERROR_CODE_METAL_EXECUTION_TIMEOUT = 25;
  ERROR_CODE_MAC_PROFILE_NOT_CERTIFIED = 26;
  ERROR_CODE_BACKEND_ABI_MISMATCH = 27;
}

// Error payload. MUST NOT contain prompt/response content, file paths,
// or credentials (spec §21.1).
message EngineError {
  string request_id = 1;
  ErrorCode code = 2;
  string message = 3;          // static, content-free description
  bool retryable = 4;
  string component = 5;        // e.g. "admission", "scheduler", "backend"
  uint32 retry_after_ms = 6;   // suggested backoff when retryable
  map<string, int64> numeric_details = 7;  // e.g. {"limit_tokens": 32768}
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;            // EOS or stop sequence
  FINISH_REASON_LENGTH = 2;          // max_output_tokens reached
  FINISH_REASON_CANCELLED = 3;       // client/platform cancel
  FINISH_REASON_DEADLINE = 4;        // deadline exceeded mid-generation
  FINISH_REASON_ERROR = 5;           // engine failure
  FINISH_REASON_CONTENT_FILTER = 6;  // reserved for future local filter
}

message Usage {
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 total_tokens = 3;
}

message Timing {
  uint32 queue_ms = 1;
  uint32 tokenize_ms = 2;
  uint32 prefill_ms = 3;
  uint32 decode_ms = 4;
  uint32 total_ms = 5;
}

// Roles are a closed allowlist (spec §13.2). Unknown roles are rejected,
// never silently concatenated.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_DEVELOPER = 2;
  ROLE_USER = 3;
  ROLE_ASSISTANT = 4;
  ROLE_TOOL = 5;
}

message Message {
  Role role = 1;
  string content = 2;
}
